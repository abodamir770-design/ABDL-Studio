name: Build ABDL Studio EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "ABDL_Studio" deepseek_python_20261016_3adc7d.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ABDL_Studio_Windows
          path: dist/ABDL_Studio.exe
          retention-days: 90
